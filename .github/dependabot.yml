version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Compiled against a deliberately older ImageJ so the plugin runs on older FIJI installs too.
      - dependency-name: net.imagej:ij
    groups:
      maven:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
