name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Java ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      # The jar in the repository root is what users download, so it must not drift from the
      # source: fail if it's missing or from another version, warn if it differs from this build.
      - name: Check the committed plugin jar
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        run: ./.github/check-committed-jar.sh

      - name: Upload plugin jar
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: cerebellar-layer-plugin
          path: target/cerebellar-layer-plugin-*.jar
          if-no-files-found: error
