name: Release

# Push a tag such as v1.1.0 (matching the version in pom.xml) to build the plugin jar and
# publish it as a GitHub Release, alongside the copy committed in the repository root.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check the tag matches the project version
        run: |
          VERSION=$(./mvnw -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom.xml version $VERSION"
            exit 1
          fi

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/cerebellar-layer-plugin-*.jar \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
